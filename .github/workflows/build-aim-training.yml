name: Build Aim Training Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'aim-training-android/**'
      - '.github/workflows/build-aim-training.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: aim-training-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aim-training-debug-apk
          path: aim-training-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
