name: AI Research Validation
on:
  push:
    branches: [research/ai-science-safeguards-20261009]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server syntax
        run: node --check server.js
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test isolated mathematical invariants
        run: node --test test/ai-math.test.cjs
